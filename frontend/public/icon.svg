<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="hazardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Shield Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  <rect x="3" y="3" width="58" height="58" rx="13" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- Road Perspective Lane -->
  <polygon points="12,56 52,56 38,18 26,18" fill="url(#roadGrad)"/>
  
  <!-- Road Edge Borders (Glowing Cyan) -->
  <line x1="12" y1="56" x2="26" y2="18" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="52" y1="56" x2="38" y2="18" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Road Center Dashed Line -->
  <line x1="32" y1="22" x2="32" y2="28" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="34" x2="32" y2="42" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="48" x2="32" y2="56" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

  <!-- Detected Pothole Oval with High-Tech Crosshair -->
  <ellipse cx="32" cy="41" rx="10" ry="5.5" fill="none" stroke="url(#hazardGrad)" stroke-width="2" filter="url(#glow)"/>
  
  <!-- Target Reticles -->
  <path d="M 20,38 L 18,38 L 18,44 L 20,44" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M 44,38 L 46,38 L 46,44 L 44,44" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  
  <!-- Central Target Reticle Dot -->
  <circle cx="32" cy="41" r="2" fill="#ef4444" filter="url(#glow)"/>

  <!-- AI Neural Scan Arc on Top -->
  <path d="M 22,14 A 12,12 0 0,1 42,14" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>
  <circle cx="32" cy="11" r="2" fill="#38bdf8" filter="url(#glow)"/>
</svg>